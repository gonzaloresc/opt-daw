<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario prestamo</title>
</head>
<body>

    <form action="/prestamo" method="post">

        <label for="libroId">ID del libro: </label>
        <input type="text" id="libroId" name="libroId"><br>

        <label for="nombreSocio">Nombre del socio: </label>
        <input type="text" id="nombreSocio" name="nombreSocio"><br>

        <label for="diasPrestamo">Dias de prestamo: </label>
        <input type="number" id="diasPrestamo" name="diasPrestamo"><br>

        <label for="carnetPremium">Tiene carnet premium: </label>
        <input type="checkbox" id="carnetPremium" name="carnetPremium"><br>

    </form>

</body>
</html>
