<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reserva</title>
</head>
<body>

    <form action="/reservar" method="post">

        <label for="pistaID">ID de la pista</label>
        <input type="number" id="pistaID" name="pistaID"><br>

        <label for="jugador">Jugador: </label>
        <input type="text" id="jugador" name="jugador"><br>

        <label for="horas">Horas: </label>
        <input type="number" id="horas" name="horas"><br>

        <label for="luzArtificial">Luz Artificial </label>
        <input type="checkbox" id="luzArtificial" name="luzArtificial"><br>

        <button type="submit">Enviar</button>

    </form>

</body>
</html>
